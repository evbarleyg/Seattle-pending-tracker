name: Deploy New Style Preview

on:
  push:
    branches: ["codex/staging-buyer-profile-toggle"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          path: preview-src

      - name: Checkout current main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: preview-src/package-lock.json

      - name: Install dependencies
        working-directory: preview-src
        run: npm ci

      - name: Build preview app
        working-directory: preview-src
        run: npm run build

      - name: Compose root plus preview path
        run: |
          mkdir -p site/new-style
          # Old-style markup from main; data from staging so both views read
          # the same enriched dataset (Redfin actives + bid-up backfill).
          cp main-src/index.html site/
          cp main-src/favicon.ico site/
          cp main-src/favicon.svg site/
          cp -R main-src/assets site/assets
          cp preview-src/public/*.csv site/
          cp preview-src/public/*.json site/
          cp -R preview-src/dist/. site/new-style/
          cat > site/new-style-preview.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=./new-style/" />
          <title>Seattle Pending Tracker New Style Preview</title>
          <a href="./new-style/">Open the new style preview</a>
          HTML

      - name: Inject view-toggle into both styles
        run: |
          node preview-src/scripts/inject_view_toggle.js site/index.html new
          node preview-src/scripts/inject_view_toggle.js site/new-style/index.html old

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
